# kind cluster for Warden (ADR-003). Node image must equal versions.yaml `kubernetes.kindNodeImage`
# (scripts/verify.py checks). Host ports 18080/18443 avoid clashes with common local services (8080 is often
# taken, e.g. by wslrelay) and are bound to 127.0.0.1 so the gateway is never reachable from the LAN.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: warden
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - containerPort: 30080   # Envoy Gateway HTTP NodePort (warden-gitops/clusters/local)
        hostPort: 18080
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30443   # Envoy Gateway HTTPS NodePort
        hostPort: 18443
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
