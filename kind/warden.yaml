# kind cluster for Warden (ADR-003). Node image must equal versions.yaml `kubernetes.kindNodeImage`
# (scripts/verify.py checks). Host ports 8080/8443 avoid needing admin rights or clashing with IIS on Windows.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: warden
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - containerPort: 30080   # Envoy Gateway HTTP NodePort (warden-gitops/clusters/local)
        hostPort: 8080
        protocol: TCP
      - containerPort: 30443   # Envoy Gateway HTTPS NodePort
        hostPort: 8443
        protocol: TCP
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
