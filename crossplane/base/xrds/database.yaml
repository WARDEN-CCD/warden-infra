# Encodes ADR-016. The same XR schema is served on kind and AKS; each cluster installs its own
# implementation of the database-default Composition.
# Developer-facing Database API. Identical on every cluster; the backend is chosen by the cluster overlay,
# which supplies a different database-default Composition (CloudNativePG locally, Azure Flexible Server on AKS).
# Crossplane v2: namespaced XR, no claims. status.connectionSecret names the Secret with host, port, dbname,
# username, password and uri: always <name>-conn, whatever the backend.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: databases.platform.warden.dev
spec:
  scope: Namespaced
  group: platform.warden.dev
  names:
    kind: Database
    plural: databases
  defaultCompositionRef:
    name: database-default
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: string
                  description: small = 1 instance / 1 GiB storage locally, B1ms in Azure; medium = 2 instances / 5 GiB
                  enum: [small, medium]
                  default: small
                version:
                  type: string
                  description: PostgreSQL major version
                  enum: ["17", "18"]
                  default: "18"                  # CloudNativePG 1.30's default major
                network:
                  type: object
                  description: Network access for the managed Azure backend; the local backend ignores this field.
                  required: [allowedSourceIp]
                  properties:
                    allowedSourceIp:
                      type: string
                      description: Single IPv4 egress address allowed by the Azure PostgreSQL firewall.
                      pattern: '^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$'
                  required: [allowedSourceIp]
            status:
              type: object
              properties:
                endpoint:
                  type: string
                connectionSecret:
                  type: string
                  description: Secret <name>-conn in this namespace with host, port, dbname, username, password, uri
