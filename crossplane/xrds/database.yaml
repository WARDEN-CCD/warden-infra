# Encodes ADR-016. Exercised on kind with the database-cnpg composition (2026-10-24).
# Developer-facing Database API. Identical on every cluster; the backend is chosen by the cluster overlay,
# which patches defaultCompositionRef (database-cnpg on local, database-azure on azure).
# Crossplane v2: namespaced XR, no claims. status.connectionSecret names the Secret with host, port, dbname,
# username, password and uri (CNPG: <name>-app).
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: databases.platform.warden.dev
spec:
  scope: Namespaced
  group: platform.warden.dev
  names:
    kind: Database
    plural: databases
  defaultCompositionRef:
    name: database-cnpg
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: string
                  description: small = 1 instance / 1 GiB storage locally, B1ms in Azure; medium = 2 instances / 5 GiB
                  enum: [small, medium]
                  default: small
                version:
                  type: string
                  description: PostgreSQL major version
                  enum: ["17", "18"]
                  default: "18"                  # CloudNativePG 1.30's default major
            status:
              type: object
              properties:
                endpoint:
                  type: string
                connectionSecret:
                  type: string
                  description: Secret in this namespace with host, port, dbname, username, password, uri
