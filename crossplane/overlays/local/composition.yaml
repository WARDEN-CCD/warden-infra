# Database -> CloudNativePG Cluster in the XR's own namespace (ADR-016). The local cluster's
# database-default Composition is CloudNativePG; AKS installs a provider-backed implementation with the same name.
# PostgreSQL images are pinned by digest; the admission VAP allows exactly this registry path
# for CNPG-managed pods (warden-policy, THREAT_MODEL T06 carve-out).
# Connection details: the composition owns Secret <name>-conn (host, port, dbname, username, password, uri), the
# same name on every cluster (DESIGN §10), and hands it to CNPG as the database owner's credentials. The password
# is generated once and read back from the observed Secret on every later reconcile, so it never rotates by accident.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: database-default
  labels:
    warden.dev/backend: cnpg
spec:
  compositeTypeRef:
    apiVersion: platform.warden.dev/v1alpha1
    kind: Database
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $name := $xr.metadata.name }}
            {{- $size := $xr.spec.size | default "small" }}
            {{- $version := $xr.spec.version | default "18" }}
            {{- $images := dict
                  "17" "ghcr.io/cloudnative-pg/postgresql:17.11-system-trixie@sha256:ae22bdd6008e02c18180c84192b3afbc95a758a184899f1cb7e85ed9c3ef8128"
                  "18" "ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:f7e00138159bb45d70b624ba25e446924cb3ed1bf366d13e936c3f81b914064e" }}
            {{- $host := printf "%s-rw.%s.svc" $name $xr.metadata.namespace }}
            {{- $observed := dig "resources" "conn" "resource" "data" "password" "" .observed }}
            {{- $password := randAlphaNum 32 }}
            {{- if $observed }}{{ $password = b64dec $observed }}{{ end }}
            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $name }}-conn
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: conn
            type: kubernetes.io/basic-auth
            data:
              username: {{ b64enc "app" }}
              password: {{ b64enc $password }}
              host: {{ b64enc $host }}
              port: {{ b64enc "5432" }}
              dbname: {{ b64enc "app" }}
              uri: {{ printf "postgresql://app:%s@%s:5432/app" $password $host | b64enc }}
            ---
            apiVersion: postgresql.cnpg.io/v1
            kind: Cluster
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cluster
            spec:
              instances: {{ if eq $size "medium" }}2{{ else }}1{{ end }}
              imageName: {{ get $images $version }}
              storage:
                size: {{ if eq $size "medium" }}5Gi{{ else }}1Gi{{ end }}
              bootstrap:
                initdb:
                  database: app
                  owner: app
                  secret:
                    name: {{ $name }}-conn
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 512Mi
            ---
            apiVersion: platform.warden.dev/v1alpha1
            kind: Database
            status:
              endpoint: {{ $host }}
              connectionSecret: {{ $name }}-conn
    - step: automatically-detect-readiness
      functionRef:
        name: function-auto-ready
