# Crossplane v2 composes arbitrary resources, but needs RBAC for non-Crossplane kinds. Aggregated into
# Crossplane's own ClusterRole by label. Scope: CloudNativePG clusters only (database-cnpg composition).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-compose-cnpg
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
